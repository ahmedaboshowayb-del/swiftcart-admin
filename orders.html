<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SwiftCart Admin — Orders</title>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div class="layout">
  <div id="sidebarMount"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1>Orders</h1>
        <p>Track and manage customer orders</p>
      </div>
    </div>

    <div class="page-content">
      <div class="card">
        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by order ID…"/>
          </div>
          <select class="filter-select" id="statusFilter">
            <option value="">All Statuses</option>
            <option value="preparing">Preparing</option>
            <option value="on_the_way">On the Way</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>User</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="8"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="orderModal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <div class="modal-title">Order Details</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="orderDetailContent"></div>
    <div class="modal-footer">
      <select class="filter-select" id="statusUpdateSelect">
        <option value="preparing">Preparing</option>
        <option value="on_the_way">On the Way</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button class="btn btn-primary" id="updateStatusBtn">Update Status</button>
    </div>
  </div>
</div>

<script type="module" src="js/orders.js"></script>
</body>
</html>
